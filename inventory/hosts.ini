# Инвентарь — список серверов, которыми управляет Ansible.

# Группа серверов "webservers" — на неё ссылается плейбук (hosts: webservers)
[webservers]
# Формат: <имя_в_ansible> ansible_host=<IP или DNS-имя сервера>
web01 ansible_host=192.168.0.106
; web02 ansible_host=192.168.188.143

# Переменные, общие для всех серверов группы webservers
[webservers:vars]
# Пользователь, под которым Ansible подключается по SSH
ansible_user=zhyldyz

# Приватный SSH-ключ для подключения (публичный должен лежать на серверах в ~/.ssh/authorized_keys)
ansible_ssh_private_key_file=~/.ssh/id_ed25519

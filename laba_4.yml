- name: Лабораторная работа 4
  hosts: webservers
  become: true
  tasks:
    - name: Установить htop и tree
      ansible.builtin.apt:
        name:
          - htop
          - tree
        state: present
        update_cache: yes

    - name: Создать пользователя devuser
      ansible.builtin.user:
        name: devuser
        shell: /bin/bash
        state: present

    - name: Создать каталог /opt/lab4
      ansible.builtin.file:
        path: /opt/lab4
        state: directory
        owner: devuser
        mode: "0755"

    - name: Создать файл info.txt
      ansible.builtin.copy:
        dest: /opt/lab4/info.txt
        content: "Выполнила: Алмасбекова Жылдыз\n"
        owner: devuser
        mode: "0644"

    - name: Запустить cron и включить автозагрузку
      ansible.builtin.service:
        name: cron
        state: started
        enabled: yes
